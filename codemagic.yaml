# Codemagic CI/CD — HaramainKU MAM Mobile
# iOS + Android build otomatis tiap push

workflows:
  haramainku-mam-ios:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/build
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS release Runner.app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r haramainku_mam_release.ipa Payload/
    artifacts:
      - haramainku_mam_release.ipa
    publishing:
      email:
        recipients:
          - admin@haramaintour.com

  haramainku-mam-android:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android Release APK (minified)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - admin@haramaintour.com

# Trigger: push ke main / manual
triggering:
  events:
    - push
    - pull_request
  branch_patterns:
    - pattern: main
      include: true
      source: true
